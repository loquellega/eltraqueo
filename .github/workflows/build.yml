# Compila eltraqueo para Mac (Apple Silicon) y Windows.
# Corre al empujar una etiqueta v* (crea un release) o a mano desde Actions.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Compilar
        run: pyinstaller eltraqueo.spec --noconfirm
      - name: Empaquetar (Mac)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent eltraqueo.app ../eltraqueo-${{ matrix.name }}.zip
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/eltraqueo/* -DestinationPath eltraqueo-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eltraqueo-${{ matrix.name }}
          path: eltraqueo-${{ matrix.name }}.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: eltraqueo-${{ matrix.name }}.zip
